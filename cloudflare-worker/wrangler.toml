name = "court-monitor-ural"
main = "worker.js"
compatibility_date = "2024-01-01"

[triggers]
# Cron ВЫКЛЮЧЕН до создания Worker'а территории. При включении — сдвинуть
# от ХМАО (03:45 UTC), напр. 04:30 UTC, чтобы не бить sudrf одновременно.
crons = []

# ── Пер-инстансные настройки территории «Урал» ──────────────────────────────
[vars]
ALLOWED_ORIGIN = "https://selivanovas.github.io"
CASES_DATA_URL = "https://selivanovas.github.io/dashboard-ural/data/cases.json"
GH_REPO = "SelivanovAS/dashboard-ural"

# KV-хранилище push-подписок PWA территории.
# Создать: wrangler kv namespace create PUSH_SUBSCRIPTIONS → вписать id.
[[kv_namespaces]]
binding = "PUSH_SUBSCRIPTIONS"
id = "ЗАПОЛНИТЬ-ПРИ-СОЗДАНИИ-WORKER"
