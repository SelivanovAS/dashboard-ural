name = "court-monitor-ural"
main = "worker.js"
compatibility_date = "2024-01-01"

[triggers]
# Автозапуск Урала: 03:00 UTC = 08:00 Екатеринбург, пн-пт (решение юриста
# 15.07.2026). ХМАО-инстанс ходит в 03:30 UTC — разнос 30 мин, чтобы не бить
# sudrf одновременно. Буквенный `mon-fri` ОБЯЗАТЕЛЕН: Cloudflare нумерует
# дни 1=Sun..7=Sat. Применяется только после `wrangler deploy`.
crons = ["0 3 * * mon-fri"]

# ── Пер-инстансные настройки территории «Урал» ──────────────────────────────
[vars]
ALLOWED_ORIGIN = "https://selivanovas.github.io"
CASES_DATA_URL = "https://selivanovas.github.io/dashboard-ural/data/cases.json"
GH_REPO = "SelivanovAS/dashboard-ural"
# VAPID-пара территории (16.07.2026): public обязан совпадать с
# region_front.js форка; private — секрет VAPID_PRIVATE_KEY (тот же PEM,
# что в GH-секрете форка). Нужен кнопке «Тест push» админки.
VAPID_PUBLIC_KEY = "BHjYv0QmRYDkdwqvERpsbWi8wWkmwqMkn78Q-TN9gK7awAVjeQ7u2LebeUKFyiT_BTlJOVD3YB6E3MLUKe43d7k"

# KV-хранилище push-подписок PWA территории (+ дампы и журнал импорта).
# Namespace «URAL_PUSH_SUBSCRIPTIONS» создан 16.07.2026 (титул с префиксом:
# голый «PUSH_SUBSCRIPTIONS» занят ХМАО-инстансом; binding при этом прежний).
[[kv_namespaces]]
binding = "PUSH_SUBSCRIPTIONS"
id = "a42e1b5a8c31485e9483ab9ee80be518"
